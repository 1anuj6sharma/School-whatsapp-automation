services:
  postgres:
    image: postgres:16-alpine
    container_name: school_whatsapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school_whatsapp}
      POSTGRES_USER: ${DB_USER:-wonderschool}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-world21school}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wonderschool} -d ${DB_NAME:-school_whatsapp} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - school_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_whatsapp_backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3010"
    volumes:
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3010/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_whatsapp_frontend
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - school_net

volumes:
  postgres_data:
    driver: local

networks:
  school_net:
    driver: bridge
