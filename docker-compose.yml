services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_whatsapp_backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3010"
    volumes:
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3010/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - school_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_whatsapp_frontend
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - school_net

networks:
  school_net:
    driver: bridge
