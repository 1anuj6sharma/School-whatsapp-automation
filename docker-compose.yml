name: school_whatsapp_demo

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: school_whatsapp_backend_demo:latest
    container_name: school_whatsapp_backend_demo
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-3021}:3010"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - school_net_demo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: school_whatsapp_frontend_demo:latest
    container_name: school_whatsapp_frontend_demo
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-${APP_PORT:-3020}}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - school_net_demo

networks:
  school_net_demo:
    driver: bridge
