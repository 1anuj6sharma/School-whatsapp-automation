version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_whatsapp_backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3010"
    volumes:
      - ./backend/data:/app/data
    networks:
      - school_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_whatsapp_frontend
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      - backend
    networks:
      - school_net

networks:
  school_net:
    driver: bridge
